<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jesses butcher boxes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Welcome to Jesse's Website!</h1>
        <h3>Fresh local meat boxes.</h3>
    <p>Customised meat boxes for local delivery or collection </p>
    <div id="box">
  <form action="https://formsubmit.co/goodrawdeal@gmail.com" method="POST">
       <h2>Contact/Order</h2><br>
  <label for= "name">Enter your name:</label><br>
      <input type="text" name="name" id="name" required><br><br>
      <label for= "email">Enter your email:</label><br>
     <input type="email" name="email" id="email" required><br><br>
      <label>Pick a Meat Box:</label><br>
    <label for="poultry">Poultry:</label>
      <input type="checkbox" name="poultry" id="poultry">
    <label for="red meat">  Red Meat:</label>
      <input type="checkbox" name="red meat" id="red meat">
    <label for="Game Box">  Game Box:</label>
      <input type="checkbox" name="Game Box" id="Game Box">
    <label for="Mix Box">  Mix Box:</label>
      <input type="checkbox" name="Mix Box" id="Mix Box"><br><br>
    <label for="Message">Details/Message:</label><br>
      <textarea name="Message" rows="4" id="Message" style="width:300px; padding:10px; margin-top:4px; border-radius:20px;"></textarea><br><br>
     <button type="submit" style="<color:black;">Send</button>
</form>  
    </div>
</body>
</html>
